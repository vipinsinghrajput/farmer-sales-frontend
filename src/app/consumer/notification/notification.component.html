<div class="notification-container">


  <div class="dropdown" >
    <div class="dropdown-header">
      <span>Notifications</span>
      <button class="mark-read-all" (click)="markAllAsRead()">Mark all as read</button>
      <button (click)="onClose()">❌ </button>
    </div>

    <!-- Filter Toggle for Unread Notifications -->
    <div class="filter-container">
      <button (click)="toggleFilter()" class="filter-btn">
        {{ showUnreadOnly ? 'Show All' : 'Show Unread Only' }}
      </button>
    </div>

    <div class="dropdown-list" *ngIf="filteredNotifications.length > 0; else noNotifs">
      <div *ngFor="let notif of filteredNotifications"
           class="notification-item"
           [class.unread]="!notif.read">
        <div class="message-row">
          <span *ngIf="!notif.read" class="unread-dot"></span>
          <div class="message-info">
            <p>{{ notif.message }}</p>
            <small>{{ notif.createdAt | date: 'short' }}</small>
          </div>
        </div>
        <button *ngIf="!notif.read" (click)="markAsRead(notif.id)" class="mark-single-btn">
          Mark as read
        </button>
      </div>
    </div>

    <ng-template #noNotifs>
      <div class="no-notifications">No notifications</div>
    </ng-template>
  </div>
</div>
