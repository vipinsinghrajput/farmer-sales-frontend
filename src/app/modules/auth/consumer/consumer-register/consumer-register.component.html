<div class="register-container">
    <div class="register-box">
      <h2>Consumer Registration</h2>
  
      <!-- Error Message -->
      <!-- <div *ngIf="errorMsg" class="error-msg">
        {{ errorMsg }}
      </div> -->
      <div #errorRef *ngIf="errorMsg" class="error-msg" tabindex="-1">
        {{ errorMsg }}
      </div>
  
      <form (ngSubmit)="registerConsumer()" #form="ngForm" class="register-form">
  
        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" [(ngModel)]="consumerData.name" required #name="ngModel" />
          <div class="error" *ngIf="name.invalid && name.touched">Full Name is required.</div>
        </div>
  
        <!-- Mobile Number -->
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" name="mobileNumber" [(ngModel)]="consumerData.mobileNumber" required pattern="^[0-9]{10}$" #mobile="ngModel" />
          <div class="error" *ngIf="mobile.invalid && mobile.touched">
            Valid 10-digit Mobile Number is required.
          </div>
        </div>
  
        <!-- Email Address -->
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" [(ngModel)]="consumerData.email" required email #email="ngModel" />
          <div class="error" *ngIf="email.invalid && email.touched">Valid Email is required.</div>
        </div>
  
        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" [(ngModel)]="consumerData.password" required minlength="6" #password="ngModel" />
          <div class="error" *ngIf="password.invalid && password.touched">Password must be at least 6 characters.</div>
        </div>
  
        <!-- Delivery Address -->
        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" name="deliveryAddress" [(ngModel)]="consumerData.deliveryAddress" required #deliveryAddress="ngModel" />
          <div class="error" *ngIf="deliveryAddress.invalid && deliveryAddress.touched">Delivery Address is required.</div>
        </div>
  
        <!-- Pincode -->
        <div class="form-group">
          <label>Pincode</label>
          <input type="text" name="pincode" [(ngModel)]="consumerData.pincode" required pattern="^[0-9]{6}$" #pincode="ngModel" />
          <div class="error" *ngIf="pincode.invalid && pincode.touched">Valid 6-digit Pincode is required.</div>
        </div>
  
        <button type="submit" [disabled]="form.invalid" class="register-button">Register</button>
  
      </form>
    </div>
  </div>
