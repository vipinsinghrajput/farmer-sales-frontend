  <div class="login-container">
    <div class="login-box">
      <h2>Farmer Login</h2>
  
      <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="loginData.email" required placeholder="Enter your email" />
        </div>
  
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" [(ngModel)]="loginData.password" required placeholder="Enter your password" />
        </div>
  
        <button type="submit" class="login-button">Login</button>
      </form>
  
      <p *ngIf="errorMsg" class="error-text">{{ errorMsg }}</p>
  
      <div class="forgot-password">
        <a (click)="goToForgotPassword()">Forgot Password?</a>
      </div>
    </div>
  </div>
