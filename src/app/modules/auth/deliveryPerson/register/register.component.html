<div class="register-container">
  <div class="register-box">
    <h2 >DeliveryPerson Registration</h2>

    <div #errorRef *ngIf="errorMsg" class="error-msg" tabindex="-1">
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="registerDeliveryPerson()" #form="ngForm" class="register-form">

      <!-- Full Name -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" [(ngModel)]="deliveryData.name" required #name="ngModel" />
        <div class="error" *ngIf="name.invalid && name.touched">Full Name is required.</div>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" name="mobile" [(ngModel)]="deliveryData.mobile" required pattern="^[6-9]\d{9}$" #mobile="ngModel" />
        <div class="error" *ngIf="mobile.invalid && mobile.touched">Valid 10-digit mobile number required.</div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="deliveryData.email" required #email="ngModel" />
        <div class="error" *ngIf="email.invalid && email.touched">Valid email is required.</div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="deliveryData.password" required minlength="8" #password="ngModel" />
        <div class="error" *ngIf="password.invalid && password.touched">Password must be at least 8 characters.</div>
      </div>

      <!-- Vehicle Number -->
      <div class="form-group">
        <label>Vehicle Number</label>
        <input type="text" name="vehicleNumber" [(ngModel)]="deliveryData.vehicleNumber" required
               pattern="^[A-Z]{2}[0-9]{2}\s?[A-Z]{1,2}\s?[0-9]{1,4}$" #vehicle="ngModel" />
        <div class="error" *ngIf="vehicle.invalid && vehicle.touched">Enter valid Indian vehicle number (e.g., MP09 AB 1234).</div>
      </div>

      <!-- License Number -->
      <div class="form-group">
        <label>License Number</label>
        <input type="text" name="licenseNumber" [(ngModel)]="deliveryData.licenseNumber" required
               pattern="^[A-Z]{2}[0-9]{13}$" #license="ngModel" />
        <div class="error" *ngIf="license.invalid && license.touched">Enter valid license number (e.g., MH1420201234567).</div>
      </div>

      <button type="submit" [disabled]="form.invalid" class="register-button">Register</button>
    </form>
  </div>
</div>
