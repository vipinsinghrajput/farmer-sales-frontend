<div class="register-container">
    <div class="register-box">
      <h2>Admin Registration</h2>
  
      <!-- Error Message -->
      <div #errorRef *ngIf="errorMsg" class="error-msg">
        {{ errorMsg }}
      </div>
  
      <form (ngSubmit)="registerAdmin()" #form="ngForm" class="register-form">
  
        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" [(ngModel)]="adminData.name" required #name="ngModel" />
          <div class="error" *ngIf="name.invalid && name.touched">Full Name is required.</div>
        </div>
  
        <!-- Email -->
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" [(ngModel)]="adminData.email" required #email="ngModel" />
          <div class="error" *ngIf="email.invalid && email.touched">Valid Email is required.</div>
        </div>
  
        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" [(ngModel)]="adminData.password" required minlength="6" #password="ngModel" />
          <div class="error" *ngIf="password.invalid && password.touched">Password must be at least 6 characters.</div>
        </div>
  
        <button type="submit" [disabled]="form.invalid" class="register-button">Register</button>
      </form>
    </div>
  </div>
