   <app-landing-navbar></app-landing-navbar>


   <div class="container mt-5">
    <div class="text-center mb-5">
      <h1 class="display-4">🌾 Farmer-to-Consumer Sales Platform</h1>
      <p class="lead">Connecting farmers directly to consumers with transparency, trust, and technology.</p>
    </div>
  
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <!-- Farmer Section -->
      <div class="col">
        <div class="card h-100 shadow rounded-4 text-center p-4">
          <h3 class="mb-3">👨‍🌾 Farmer</h3>
          <button (click)="goToFarmerRegister()" class="btn btn-outline-success mb-2 w-100">
            Register as Farmer
          </button>
          <button (click)="goToFarmerLogin()" class="btn btn-success w-100">Farmer Login</button>
        </div>
      </div>
  
      <!-- Consumer Section -->
      <div class="col">
        <div class="card h-100 shadow rounded-4 text-center p-4">
          <h3 class="mb-3">🛒 Consumer</h3>
          <button (click)="goToConsumerRegister()" class="btn btn-outline-primary mb-2 w-100">
            Register as Consumer
          </button>
          <button (click)="goToConsumerLogin()" class="btn btn-primary w-100">Consumer Login</button>
        </div>
      </div>
  
      <!-- DeliveryPerson Section -->
      <div class="col">
        <div class="card h-100 shadow rounded-4 text-center p-4">
          <h3 class="mb-3">🛠️ DeliveryPerson </h3>
          <button (click)="goToDeliveryPersonRegister()" class="btn btn-outline-dark mb-2 w-100">
            Register as deliveryPerson
          </button> 
          <button (click)="goToDeliveryPersonLogin()" class="btn btn-dark w-100">DeliveryPerson Login</button>
        </div>
        
      </div>
    </div>
  </div>
